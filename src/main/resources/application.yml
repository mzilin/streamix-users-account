# Application metadata
info:
  app:
    environment: ${spring.profiles.active}
    name: ${spring.application.name}
    description: Streamix Account Service

# Spring application and infrastructure configuration
spring:
  application:
    name: users-account
  config:
    import:
      - optional:configserver:discovery://config-server
  datasource:
    url: jdbc:postgresql://localhost:5433/streamixdb
    driver-class-name: org.postgresql.Driver
    username: streamix
    password: streamix
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: streamix_account
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
  rabbitmq:
    host: localhost
    port: 5672
    username: streamix
    password: streamix

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Messaging properties
kafka:
  topics:
    user-registered: streamix.user.registered
    user-verified: streamix.user.verified

rabbitmq:
  exchange: streamix
  queues:
    verify-account: verify-account
    update-last-active: update-last-active
  routing-keys:
    verify-account: verify-account.routing-key
    profile-setup: profile-setup.routing-key
    platform-emails: platform-emails.routing-key
    reset-passcode: reset-passcode.routing-key
    update-last-active: update-last-active.routing-key
    delete-user-data: delete-user-data.routing-key

# Security configuration
cryptography: {}

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

# Application logging configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.mariuszilinskas.streamix: INFO

# Spring configuration for CI
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Service discovery configuration for CI
eureka:
  client:
    fetchRegistry: false
    registerWithEureka: false

# Messaging configuration for CI
kafka:
  topics:
    user-registered: dummy-topic
    user-verified: dummy-topic

rabbitmq:
  exchange: dummy-exchange
  queues:
    verify-account: dummy-queue
    update-last-active: dummy-queue
  routing-keys:
    verify-account: dummy-key
    profile-setup: dummy-key
    platform-emails: dummy-key
    reset-passcode: dummy-key
    update-last-active: dummy-key
    delete-user-data: dummy-key

# Security configuration for CI
cryptography:
  provider: local
  encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Observability configuration for CI
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
